[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twincat-mcp"
version = "0.2.0"
description = "TwinCAT engineering, Scope generation and read-only ADS diagnostics through local MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "pcyamzguy12138"}]
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
twincat-mcp = "twincat_mcp.server:main"

[project.urls]
Repository = "https://github.com/pcyamzguy12138/twincat-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twincat_mcp = ["native/*.cs", "native/*.ps1"]
